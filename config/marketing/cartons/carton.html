<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:768px;height:1344px;background:#0E0E10;overflow:hidden}
  .c{width:768px;height:1344px;display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:0}
  .nom{font-family:'Cormorant Garamond',serif;font-size:82px;font-weight:400;
       color:#F4F2ED;letter-spacing:.10em;line-height:1}
  .role{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:300;
        color:#C8A97E;letter-spacing:.30em;margin-top:26px;text-transform:uppercase}
  .filet{width:210px;height:1px;background:#C8A97E;opacity:.55;margin:64px 0}
  /* Le logo est BICOLORE : « Digital » en os, « Humans » en laiton ET en
     italique. Releve par Sam le 14/08 — la premiere version ecrivait tout en
     blanc d un seul bloc, ce qui ne respecte pas la charte. Le contraste fait
     partie de l identite, pas de la decoration. */
  .marque{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:400;
          letter-spacing:.04em}
  .marque .d{color:#F4F2ED}
  .marque .pt{color:#C8A97E;margin:0 .04em}
  .marque .h{color:#C8A97E;font-style:italic}
  .bl{font-family:Inter,sans-serif;font-size:19px;font-weight:300;
      color:#B4B1AB;letter-spacing:.02em;margin-top:16px}
  .fr{font-family:Inter,sans-serif;font-size:15px;font-weight:300;font-style:italic;
      color:#7C7A76;letter-spacing:.01em;position:absolute;bottom:96px;width:100%;text-align:center}
</style></head><body>
<div class="c">
  <div class="nom">SOPHIE</div>
  <div class="role">AI Project Manager</div>
  <div class="filet"></div>
  <div class="marque"><span class="d">Digital</span><span class="pt">&#183;</span><span class="h">Humans</span></div>
  <div class="bl">Design your own Salesforce, at your fingertips.</div>
</div>
<div class="fr">Concevez votre Salesforce, du bout des doigts.</div>
</body></html>
