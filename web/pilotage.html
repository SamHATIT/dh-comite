<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acte II — Poste de pilotage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comite.css">
<style>
/* ── L'ouverture : ce qui attend Sam maintenant ── */
.ouv{border:1px solid var(--hair);background:var(--ink-2);padding:26px 24px;margin-bottom:34px}
.ouv.urgent{border-color:var(--brass)}
.ouv-h{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.ouv-n{font-family:var(--serif);font-size:56px;font-weight:300;line-height:1;color:var(--brass)}
.ouv-l{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--bone)}
.ouv-s{font-size:12px;color:var(--bone-4);margin-top:8px;line-height:1.7}
/* Les actes en chiffres romains — motif du handoff */
.actes{margin-top:20px;border-top:1px solid var(--hair-2)}
.a{display:grid;grid-template-columns:34px 1fr auto;gap:14px;padding:14px 0;
 border-bottom:1px solid var(--hair-2);align-items:baseline}
.a-r{font-family:var(--serif);font-size:16px;color:var(--brass-3);font-style:italic}
.a-t{font-size:12.5px;color:var(--bone-3);line-height:1.7}
.a-g{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.g0{color:var(--bone-4)}.g1{color:var(--brass-2)}.g2{color:var(--brass)}
/* ── Les directions ── */
.dir{border-top:1px solid var(--hair)}
.d{display:grid;grid-template-columns:30px 1fr auto;gap:16px;padding:19px 4px;
 border-bottom:1px solid var(--hair-2);align-items:start;transition:background .2s var(--ease)}
.d:hover{background:var(--ink-2)}
.d-r{font-family:var(--serif);font-size:17px;color:var(--brass-3);font-style:italic;padding-top:3px}
.d-n{font-family:var(--serif);font-size:19px;color:var(--bone);margin-bottom:4px;line-height:1.2}
.d-m{font-family:var(--mono);font-size:11px;color:var(--bone-4);line-height:1.7}
.d-m b{color:var(--bone-3);font-weight:400}
.d-s{text-align:right;white-space:nowrap}
.d-sc{font-family:var(--serif);font-size:32px;font-weight:300;line-height:1}
.d-sl{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--bone-4);margin-top:4px}
.al{font-size:11.5px;color:var(--bone-4);padding:4px 0 4px 14px;position:relative;line-height:1.6;margin-top:6px}
.al::before{content:"";position:absolute;left:0;top:12px;width:7px;height:1px;background:var(--brass-3)}
@media (max-width:640px){
  .d{grid-template-columns:24px 1fr;gap:12px}
  .d-s{grid-column:2;text-align:left;margin-top:10px}
  .a{grid-template-columns:1fr;gap:5px}
  .a-g{text-align:left}
  .ouv-n{font-size:46px}
}
</style></head><body>
<div class="wrap">
  <div class="bandeau">
    <div><div class="marque">Digital·<em>Humans</em></div>
      <div class="devise">Comité de direction · augmenté</div></div>
    <nav class="nav">
      <a href="./">Acte I · Tableau de bord</a>
      <a href="pilotage" class="on">Acte II · Pilotage</a>
      <a href="gouvernance">Acte III · Gouvernance</a>
      <a href="rapports">Rapports</a>
      <a href="arbitrer" class="arb">Arbitrer<span id="nb-arb"></span></a>
    </nav>
  </div>

  <div class="acte">Nº 02 · Pilotage</div>
  <h1>Ce qui vous <em>attend</em></h1>
  <p class="chapo" id="date"></p>

  <div id="ouv"></div>

  <div class="section">
    <h2>Les actes</h2>
    <p class="chapo">Une ligne par direction. Ce qu'elle a produit, ce qui lui manque, ce qu'elle demande.</p>
    <div class="dir" id="dirs"></div>
  </div>

  <div class="section">
    <h2>Le nerf</h2>
    <div class="g3" id="pied"></div>
  </div>
</div>

<script>
const ROM=['I','II','III','IV','V','VI'];
const TACHES=[['observer','Observer et rapporter'],['ecrire_base','Écrire en base'],
 ['agir_production','Agir sur la production'],['envoyer_externe','Envoyer vers l\u2019extérieur'],
 ['engager_depense','Engager une dépense'],['modifier_dispositif','Modifier le dispositif']];
function coul(s){ if(s===null||s===undefined||isNaN(s)) return 'var(--bone-4)';
  return s>=75?'var(--vert)':s>=50?'var(--brass-2)':'var(--brass-3)'; }

function ouverture(d){
  const dec=d.decisions||{}, n=dec.attente_sam||0, liste=dec.liste||[];
  const el=document.getElementById('ouv');
  if(!n){
    el.className='ouv';
    el.innerHTML=`<div class="ouv-h"><span class="ouv-n">—</span>
      <span class="ouv-l">Rien ne vous attend</span></div>
      <div class="ouv-s">Aucune décision en attente d'arbitrage. Prochaine remontée demain à 7 h.</div>`;
    return;
  }
  el.className='ouv urgent';
  el.innerHTML=`<div class="ouv-h"><span class="ouv-n">${n}</span>
      <span class="ouv-l">${n>1?'décisions attendent':'décision attend'} votre arbitrage</span></div>
    <div class="ouv-s">${dec.accordees_non_executees||0} autre(s) sont accordées et attendent leur exécution —
      elles n'appellent aucune action de votre part.</div>
    <div class="actes">${liste.map((x,i)=>`
      <div class="a"><span class="a-r">${ROM[i]||i+1}</span>
        <span class="a-t">${(x.texte||'').replace(/</g,'&lt;')}</span>
        <span class="a-g ${x.age>=7?'g2':x.age>=3?'g1':'g0'}">${x.age} jour${x.age>1?'s':''}</span>
      </div>`).join('')}</div>`;
}

function directions(d){
  document.getElementById('dirs').innerHTML=(d.directions||[]).map((x,i)=>{
    let sc,sl;
    if(x.etat==='absent'){sc='<span class="nd hach">n.c.</span>';sl='aucune remontée';}
    else if(x.etat==='perime'){sc='<span class="nd hach">périmé</span>';sl=x.fraicheur||'';}
    else if(typeof x.score==='number'){sc=`<span class="d-sc" style="color:${coul(x.score)}">${x.score}</span>`;sl='sur 100';}
    else {sc='<span class="nd hach">n.c.</span>';sl='non calculable';}
    const m=[];
    if(x.manques) m.push(`<b>${x.manques}</b> donnée(s) manquante(s)`);
    if(x.demandes) m.push(`<b>${x.demandes}</b> demande(s)`);
    if(x.fraicheur && x.etat==='ok') m.push(x.fraicheur);
    return `<div class="d"><span class="d-r">${ROM[i]}</span>
      <span><div class="d-n">${x.libelle}</div>
        <div class="d-m">${m.join(' · ')||'—'}</div>
        ${x.alertes.map(a=>`<div class="al">${a.replace(/</g,'&lt;')}</div>`).join('')}</span>
      <span class="d-s">${sc}<div class="d-sl">${sl}</div></span></div>`;
  }).join('');
}

function pied(d){
  const c=d.cash||{}, dec=d.decisions||{};
  const sous=(c.solde!==null && c.seuil!==null && c.solde<c.seuil);
  document.getElementById('pied').innerHTML=`
   <div><div class="lv-l">Trésorerie déclarée</div>
     <div class="lv-v" style="text-align:left;margin-top:8px;color:${sous?'var(--brass)':'var(--bone)'}">${c.solde??'—'} €</div>
     <div style="font-size:11px;color:var(--bone-4);margin-top:6px">seuil ${c.seuil??'—'} € · déclaré le ${c.declare_le||'—'}</div></div>
   <div><div class="lv-l">Revenu récurrent</div>
     <div class="lv-v" style="text-align:left;margin-top:8px">${c.mrr??'—'} €</div>
     <div style="font-size:11px;color:var(--bone-4);margin-top:6px">lancement payant en septembre</div></div>
   <div><div class="lv-l">Décisions closes</div>
     <div class="lv-v" style="text-align:left;margin-top:8px">${dec.closes??'—'}</div>
     <div style="font-size:11px;color:var(--bone-4);margin-top:6px">avec preuve vérifiée</div></div>
   <div><div class="lv-l">En attente d'exécution</div>
     <div class="lv-v" style="text-align:left;margin-top:8px">${dec.accordees_non_executees??'—'}</div>
     <div style="font-size:11px;color:var(--bone-4);margin-top:6px">portées par les directions</div></div>`;
}

document.getElementById('date').textContent=
  new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

fetch('api/pilotage').then(r=>r.json()).then(d=>{
  if(d.erreur){document.getElementById('ouv').innerHTML='<p class="err">Données indisponibles — '+d.erreur+'</p>';return;}
  ouverture(d);directions(d);pied(d);
}).catch(e=>{document.getElementById('ouv').innerHTML='<p class="err">Injoignable — '+e+'</p>';});
</script><script>
fetch('api/en_attente').then(r=>r.json()).then(d=>{
  const e=document.getElementById('nb-arb'); if(e&&d.n>0) e.textContent=d.n;
}).catch(()=>{});
</script>
</body></html>
