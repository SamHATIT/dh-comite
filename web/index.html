<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acte I — Tableau de bord du comité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comite.css">
<style>
/* ── Le poinçon : score + arc, motif du Studio ── */
.hero{display:flex;gap:38px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.poincon{position:relative;width:150px;height:150px;flex:none}
.poincon svg{transform:rotate(-90deg)}
.poincon .sc{position:absolute;inset:0;display:flex;flex-direction:column;
 align-items:center;justify-content:center}
.poincon .sc b{font-family:var(--serif);font-size:46px;font-weight:400;font-style:italic;color:var(--bone)}
.poincon .sc span{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;
 text-transform:uppercase;color:var(--bone-4);margin-top:4px}
.hero-t{flex:1;min-width:280px}
/* ── L'INCIPIT — motif central du handoff Claude Design ── */
.notes{margin-top:26px;border-top:1px solid var(--hair)}
.inc{border-bottom:1px solid var(--hair-2);padding:16px 0}
.inc-h{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.inc-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-4)}
.inc-a{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
 text-transform:uppercase;color:var(--brass-3);cursor:pointer;white-space:nowrap;
 background:none;border:none;padding:0;display:inline-flex;align-items:center;gap:8px}
.inc-a:hover{color:var(--brass)}
.inc-a i{font-style:normal;display:inline-block;transition:transform .3s var(--ease)}
.inc-a.on i{transform:rotate(90deg)}
.inc-p{max-height:6.4em;overflow:hidden;transition:max-height .5s var(--ease);
 font-size:12px;line-height:2;color:var(--bone-3);max-width:70ch}
.inc-p.on{max-height:560px;border-left:1px solid var(--hair);padding-left:16px}
.inc-p.nul{max-height:0}
/* ── Indicateurs groupés par direction ── */
.grp{margin-bottom:26px}
.grp-h{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
.grp-t{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--bone-2)}
.grp-m{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
 text-transform:uppercase;color:var(--bone-4)}
.k{padding:13px 0;border-bottom:1px solid var(--hair-2)}
.k-h{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline}
.k-l{font-family:var(--mono);font-size:11px;color:var(--bone-4)}
.k-v{font-family:var(--serif);font-size:20px;color:var(--bone);text-align:right;white-space:nowrap}
.k-v.abs{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-4)}
.k-d{font-size:11.5px;line-height:1.8;color:var(--bone-4);margin-top:7px;
 max-height:4.4em;overflow:hidden;transition:max-height .4s var(--ease);max-width:76ch}
.k-d.on{max-height:280px}
.k-a{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--brass-3);cursor:pointer;background:none;border:none;padding:4px 0 0;display:block}
.k-a:hover{color:var(--brass)}
/* ── Alertes et décisions ── */
.li{padding:14px 0;border-bottom:1px solid var(--hair-2);display:grid;
 grid-template-columns:32px 1fr;gap:14px;align-items:baseline}
.li-r{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--brass-3)}
.li-t{font-size:12.5px;line-height:1.8;color:var(--bone-3);max-height:5.4em;overflow:hidden;
 transition:max-height .4s var(--ease);max-width:80ch}
.li-t.on{max-height:400px}
@media (max-width:640px){
  .hero{gap:24px}
  .poincon{width:120px;height:120px}
  .poincon svg{width:120px;height:120px}
  .poincon .sc b{font-size:38px}
  .k-h{grid-template-columns:1fr}
  .k-v{text-align:left;margin-top:4px}
  .li{grid-template-columns:24px 1fr;gap:10px}
}
</style></head><body>
<div class="wrap">
  <div class="bandeau">
    <div><div class="marque">Digital·<em>Humans</em></div>
      <div class="devise">Comité de direction · augmenté</div></div>
    <nav class="nav">
      <a href="./" class="on">Acte I · Tableau de bord</a>
      <a href="pilotage">Acte II · Pilotage</a>
      <a href="gouvernance">Acte III · Gouvernance</a>
      <a href="rapports">Rapports</a>
      <a href="arbitrer" class="arb">Arbitrer<span id="nb-arb"></span></a>
    </nav>
  </div>

  <div class="acte" id="acte">Nº 01 · Tableau de bord</div>
  <div class="hero">
    <div class="poincon">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="66" fill="none" stroke="#1C1C1F" stroke-width="4"/>
        <circle id="arc" cx="75" cy="75" r="66" fill="none" stroke="#C8A97E" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7"
          style="transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)"/>
        <circle cx="75" cy="75" r="56" fill="none" stroke="#C8A97E1F" stroke-width="1"/>
      </svg>
      <div class="sc"><b id="score">—</b><span id="mot">santé</span></div>
    </div>
    <div class="hero-t">
      <h1>La journée, <em>contresignée</em></h1>
      <div id="releve"></div>
    </div>
  </div>

  <div class="notes" id="notes"></div>

  <div class="section">
    <h2>Les indicateurs</h2>
    <p class="chapo" id="kpi-c">Ce que les directions ont remonté ce jour.</p>
    <div id="kpis"></div>
  </div>

  <div class="section">
    <h2>Les alertes</h2>
    <p class="chapo" id="al-c"></p>
    <div id="alertes"></div>
  </div>

  <div class="section">
    <h2>Ce qui attend votre arbitrage</h2>
    <p class="chapo" id="dec-c"></p>
    <div id="decisions"></div>
  </div>
</div>

<script>
const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI'];
const DIRS={delivery:'Delivery',commercial:'Commercial',marketing:'Marketing',
 'customer-success':'Customer Success','chief-of-staff':'Chief of Staff',legal:'Juridique'};

// ── L'incipit : deux lignes, volume déclaré, dépli sur place.
//    Rien n'est tronqué — l'incipit masque, il ne coupe pas.
function incipit(libelle, texte, id){
  if(!texte) return `<div class="inc"><div class="inc-h"><span class="inc-l">${libelle}</span>
    <span class="inc-l" style="margin-left:auto">aucun texte</span></div>
    <div class="inc-p nul"></div></div>`;
  const n=texte.length;
  return `<div class="inc"><div class="inc-h">
      <span class="inc-l">${libelle}</span>
      <button class="inc-a" data-i="${id}"><i>▸</i><span>Lire · ${n} car.</span></button>
    </div>
    <div class="inc-p" id="p${id}">${texte.replace(/</g,'&lt;')}</div></div>`;
}
function brancherIncipits(){
  document.querySelectorAll('.inc-a[data-i]').forEach(b=>b.addEventListener('click',()=>{
    const p=document.getElementById('p'+b.dataset.i);
    const on=p.classList.toggle('on'); b.classList.toggle('on',on);
    b.querySelector('span').textContent = on
      ? 'Replier' : 'Lire · '+p.textContent.length+' car.';
  }));
}

function tete(d){
  const s=d.sante||{};
  const sc=s.score;
  if(typeof sc==='number'){
    let v=0; const t=setInterval(()=>{v+=2; if(v>=sc){v=sc;clearInterval(t);}
      document.getElementById('score').textContent=v;},18);
    document.getElementById('arc').style.strokeDashoffset=414.7*(1-sc/100);
  } else document.getElementById('score').textContent='—';
  // La pastille ne prend qu'un MOT — le raisonnement va dans l'incipit.
  const t=(s.tendance||'').toString();
  const m=(t.match(/^(hausse|baisse|stable|amélioration|dégradation)/i)||['santé'])[0];
  document.getElementById('mot').textContent=m.toLowerCase();

  const manq=s.domaines_manquants||[];
  const rap=6-manq.length, pct=Math.round(rap*100/6);
  document.getElementById('releve').innerHTML=`
    <div class="lv"><span class="lv-l">Brief</span><span class="lv-v">${d.date||'—'}</span></div>
    <div class="lv"><span class="lv-l">Directions ayant rapporté</span>
      <span class="lv-v">${rap}<span style="font-size:13px;color:var(--bone-4)"> / 6</span></span></div>
    <div style="height:2px;background:var(--ink-3);overflow:hidden;margin-top:-6px">
      <i style="display:block;height:100%;background:var(--brass);width:${pct}%;transition:width .9s var(--ease)"></i></div>`;

  let h=incipit('Calcul du score', s.calcul, 'c');
  h+=incipit('Tendance', s.tendance, 't');
  manq.forEach((x,i)=>h+=incipit('Domaine manquant · '+(i+1), x, 'm'+i));
  document.getElementById('notes').innerHTML=h;
  brancherIncipits();
}

function kpis(d){
  const k=d.kpis||[];
  document.getElementById('kpi-c').textContent=
    k.length+' indicateur(s) remonté(s) ce jour. Une valeur, et son constat.';
  const grp={};
  k.forEach(x=>{ const g=x.direction||'autres'; (grp[g]=grp[g]||[]).push(x); });
  document.getElementById('kpis').innerHTML=Object.entries(grp).map(([g,items])=>`
    <div class="grp"><div class="grp-h">
      <span class="grp-t">${DIRS[g]||g}</span>
      <span class="grp-m">${items.length} indicateur${items.length>1?'s':''}</span></div>
      ${items.map((x,i)=>{
        const v=x.valeur||'', court=v.length<=34, id='k'+g+i;
        return `<div class="k"><div class="k-h">
            <span class="k-l">${x.nom}</span>
            <span class="k-v ${v?'':'abs'}">${court?v:(v.split(/[;(]/)[0].slice(0,30)||'—')}</span></div>
          ${!court&&v?`<div class="k-d" id="d${id}">${v.replace(/</g,'&lt;')}</div>
            <button class="k-a" data-k="${id}">Lire · ${v.length} car.</button>`:''}</div>`;
      }).join('')}</div>`).join('');
  document.querySelectorAll('.k-a[data-k]').forEach(b=>b.addEventListener('click',()=>{
    const e=document.getElementById('d'+b.dataset.k);
    const on=e.classList.toggle('on');
    b.textContent = on ? 'Replier' : 'Lire · '+e.textContent.length+' car.';
  }));
}

function liste(cible, items, chapo, prefixe){
  document.getElementById(chapo).textContent =
    items.length ? items.length+' entrée(s). Cliquez pour lire en entier.' : 'Aucune.';
  document.getElementById(cible).innerHTML=items.map((x,i)=>{
    const t=typeof x==='string'?x:(x.texte||JSON.stringify(x));
    return `<div class="li"><span class="li-r">${ROM[i]||i+1}</span>
      <span class="li-t" id="${prefixe}${i}" style="cursor:pointer">${t.replace(/</g,'&lt;')}</span></div>`;
  }).join('');
  items.forEach((_,i)=>{
    const e=document.getElementById(prefixe+i);
    if(e) e.addEventListener('click',()=>e.classList.toggle('on'));
  });
}

fetch('api/brief_complet').then(r=>r.json()).then(d=>{
  if(d.erreur){document.getElementById('releve').innerHTML='<p class="err">'+d.erreur+'</p>';return;}
  tete(d); kpis(d);
  liste('alertes', d.alertes||[], 'al-c', 'a');
  liste('decisions', d.decisions_attendues||[], 'dec-c', 'x');
}).catch(e=>{document.getElementById('releve').innerHTML='<p class="err">Injoignable — '+e+'</p>';});
</script><script>
fetch('api/en_attente').then(r=>r.json()).then(d=>{
  const e=document.getElementById('nb-arb'); if(e&&d.n>0) e.textContent=d.n;
}).catch(()=>{});
</script>
</body></html>
