services:
  comite:
    build: .
    container_name: dh-comite
    env_file: .env
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ./:/workspace
      - comite_home:/root
      - /var/log/digital-humans:/prodlogs:ro
      # Backlog de la plateforme, en LECTURE SEULE (06/08). Le Directeur
      # Delivery tient le backlog des evolutions selon sa fiche, mais le
      # conteneur ne montait pas le depot : il ne pouvait rien lire. C'est la
      # cause de son immobilisme sur ce point, signalee par lui-meme.
      # Lecture seule : il propose, il ne modifie pas — conforme a son curseur
      # "ecrire_base = Conseille" et "modifier_dispositif = Observe".
      - /root/workspace/digital-humans-production/docs:/backlog:ro
      # 08/08 : les directeurs ne voyaient QUE quelques vues de base. Le 08/08,
      # quatre d'entre eux ont conclu que "rien n'a bouge sur la plateforme
      # depuis le 02/08" — alors que 32 commits avaient eu lieu, dont 11 ce
      # jour-la. Ils avaient raison sur ce qu'ils voyaient, tort sur ce qu'ils
      # en deduisaient. Le depot complet est monte en lecture seule pour qu'ils
      # puissent lire l'historique git avant de conclure.
      - /root/workspace/digital-humans-production:/repo:ro
    networks: [comite_net]
    restart: unless-stopped

  comite-db:
    image: postgres:16
    container_name: dh-comite-db
    environment:
      POSTGRES_DB: dh_comite
      POSTGRES_USER: comite
      POSTGRES_PASSWORD: ${COMITE_DB_PASSWORD}
    volumes:
      - comite_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [comite_net]
    restart: unless-stopped

  comite-web:
    image: python:3.12-slim
    container_name: dh-comite-web
    working_dir: /workspace/web
    env_file: .env
    command: sh -c "pip install --quiet --no-cache-dir fastapi uvicorn psycopg2-binary chromadb && uvicorn app:app --host 0.0.0.0 --port 8090"
    volumes:
      - ./:/workspace:ro
      # 10/08 : index de la memoire du comite, en LECTURE SEULE — le service
      # ne fait qu interroger — mais chromadb ecrit son journal meme en lecture,
      # donc pas de :ro. Signale par le Delivery : bin/memoire ne
      # fonctionnait que depuis l'hote.
      - /opt/digital-humans/rag/chromadb_v2:/opt/digital-humans/rag/chromadb_v2
    ports:
      - "127.0.0.1:8090:8090"
    networks: [comite_net]
    restart: unless-stopped

networks:
  comite_net: {}

volumes:
  comite_home: {}
  comite_db_data: {}
